<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <!-- THE TITLE OF THE GAME -->
     <header>
      MARVINZ ROCK PAPER SCISSORS
     </header>
    <p class="title">Rock Paper Scissors</p>
    <div class="but">
      
      <!-- THE ROCK BUTTON -->
      
      <button onclick="
      playGame('rock');
    " class="move-button"><img src="rock-emoji.png" class="move-icons"></button>
      
      <!-- THE PAPER BUTTON -->

    <button onclick="
      playGame('paper');
    " class="move-button"><img src="paper-emoji.png" class="move-icons"></button>
      
      <!-- THE SCISSORS BUTTON -->
    
    <button onclick="
      playGame('scissors');
    " class="move-button"><img src="scissors-emoji.png" class="move-icons"></button>

      <!-- THE RESULSTS RETURNED -->

    <p class="js-result result"></p>
    <p class="js-moves">
    </p>
    <p class="js-score score"></p>

      <!-- THE RESET BUTTON -->

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    " class="reset-score-button">Reset Score</button>
    </div>

    <script src="rock-paper-scissors.js"></script>
  </body>
</html>
